services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: policydiff
      POSTGRES_USER: policydiff
      POSTGRES_PASSWORD: policydiff
    ports:
      - "127.0.0.1:5442:5432"
    volumes:
      - policydata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policydiff"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  policydata:
